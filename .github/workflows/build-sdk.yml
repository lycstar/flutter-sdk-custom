name: Build Flutter SDK (aarch64 android)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Flutter 版本(须存在 versions/<版本>/ 目录)"
        required: true
        default: "3.47.7"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: 版本目录就位(配置与补丁拷到仓根约定位置)
        run: |
          test -d "versions/${{ inputs.version }}" || {
            echo "versions/${{ inputs.version }} 不存在; 新版本请先建目录并重校补丁" >&2
            exit 1
          }
          cp "versions/${{ inputs.version }}/build.toml" build.toml
          gclient_file="$(grep -oE "gclient = '[^']+'" build.toml | sed "s/gclient = '//;s/'//")"
          cp "versions/${{ inputs.version }}/$(basename "$gclient_file")" "$gclient_file"
          rm -rf patches
          cp -R "versions/${{ inputs.version }}/patches" patches
      - name: 释放磁盘(引擎构建 ~40G)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - name: 宿主系统库(引擎 linux 嵌入层的链接依赖)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libglib2.0-dev \
            libgtk-3-dev libx11-dev liblzma-dev
      - name: 宿主依赖
        run: bash linux-setup.sh
      - name: 宿主工具(NDK + depot_tools)
        run: |
          ndk_ver="$(grep -oE 'android-ndk-r[0-9]+[a-z]*' linux-setup.sh | head -n1)"
          echo "linux-setup.sh 约定的 NDK: ${ndk_ver:-见脚本}"
      - name: 构建(clone→sync→patch→sysroot→gn→ninja)
        run: bash linux-run.sh
      - name: 诊断(sysroot 状态)
        if: failure()
        run: |
          echo "== sysroot/ 顶层 =="; ls -la sysroot/ 2>/dev/null || echo "(不存在)"
          echo "== libfontconfig =="; find sysroot -name 'libfontconfig*' -ls 2>/dev/null | head -3 || true
          echo "== usr 链接 =="; ls -la sysroot/data/data/com.termux/files/usr/lib 2>/dev/null | head -5 || true
      - name: 打包
        run: python3 package.py
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          tag: "${{ inputs.version }}"
          artifacts: "*.tar.xz"
          allowUpdates: true
          replacesArtifacts: true
